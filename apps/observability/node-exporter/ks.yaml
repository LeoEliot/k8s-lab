apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-exporter
spec:
  commonMetadata:
    labels:
      release: kube-prometheus-stack
      app.kubernetes.io/name: node-exporter
  interval: 1h
  path: "./apps/observability/node-exporter/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  timeout: 5m
  wait: false