apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: victoria-logs
  interval: 1h
  path: "./apps/observability/victoria-logs/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  timeout: 5m
  wait: false